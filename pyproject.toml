[project]
name = "arxiv-curator"
dynamic = ["version"]
description = "Arxiv Curator - llmops-victor-bot-1, the course package for the LLMOps course on Databricks"
requires-python = "==3.12.*"
dependencies = [
    "cffi==1.17.1",
    "cloudpickle==3.1.1",
    "numpy==2.4.0",
    "pandas==2.3.0",
    "pyarrow==22.0.0",
    "databricks-sdk==0.78.0",
    "pydantic==2.11.7",
    "loguru==0.7.3",
    "python-dotenv==1.1.1",
    "databricks-vectorsearch>=0.63",
    "openai==2.8.0",
    "databricks-mcp==0.4.0",
    "backoff==2.2.1",
    "mlflow==3.8.1",
    "nest-asyncio==1.6.0",
    "arxiv==2.3.1",
    "databricks-agents==1.8.2",
    "pyyaml==6.0.2",
    "ipython>=8.20.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "psycopg>=3.1.0",
    "psycopg-pool>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pip>=25.0.1,==25.*",
    "pre-commit>=4.1.0,==4.*",
    "pytest>=9.1.1,==9.*",
    "jupyterlab>=4.0.0",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arxiv_curator*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.ruff]
line-length = 100
